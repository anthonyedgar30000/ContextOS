name: HELIX Query Bridge CI

on:
  pull_request:
    paths:
      - helix_context.py
      - tests/test_helix_context.py
      - docs/HELIX_QUERY_BRIDGE.md
      - .contextos/contracts/CTX-0003-helix-query-bridge-repair.yaml
      - .github/workflows/helix-query-bridge-ci.yml
      - .project/active-work.json
      - .project/handoffs/current-state.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact-head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile bridge
        run: python -m py_compile helix_context.py
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v
      - name: Validate project ownership record
        run: python -m json.tool .project/active-work.json >/dev/null
      - name: Verify dedicated workflow ownership boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          workflow_path = '.github/workflows/helix-query-bridge-ci.yml'
          state = json.loads(Path('.project/active-work.json').read_text(encoding='utf-8'))
          claimed = [
              workstream
              for workstream in state.get('workstreams', [])
              if workflow_path in set(workstream.get('permitted_paths', []))
          ]
          if not claimed:
              print('No current workstream claims the HELIX workflow; unrelated coordination is not a HELIX ownership failure.')
              raise SystemExit(0)
          assert len(claimed) == 1, 'HELIX workflow must have exactly one declared workstream owner'
          workstream = claimed[0]
          assert '.github/workflows/contextos-ci.yml' in workstream['protected_paths']
          boundary = workstream['capability_boundary']
          assert boundary['cloud_mutation'] is False
          assert boundary['credential_use'] is False
          PY
