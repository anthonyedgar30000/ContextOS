name: ContextOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Run ContextOS verification
        if: hashFiles('verify_cli.py') != ''
        run: python3 verify_cli.py --session session.json --policy policy.yaml --protected-mode enforce
