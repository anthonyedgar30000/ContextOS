# ContextOS policy for the local Git workflow gate.
# Empty expected values are ignored.
expected:
  remote: "https://github.com/anthonyedgar30000/ContextOS"
  branch: "cursor/contextos-verify-0186"
  commit: ""
freshness:
  max_age_seconds: 3600
enforcement:
  block_commit_on_divergence: true
  block_push_on_divergence: true
  block_commit_on_stale: false
  block_push_on_stale: false
  block_commit_when_dirty: false
  block_push_when_dirty: true
