# ContextOS policy for the freelancer ClientB handoff demo.
expected:
  repo_identity: "ClientB"
  remote: "https://github.com/anthonyedgar30000/ContextOS"
  branch: "cursor/contextos-verify-0186"
  commit: ""
freshness:
  max_age_seconds: 600
  aging_seconds: 300
enforcement:
  require_verification_before_commit: true
  require_verification_before_push: true
  block_commit_on_divergence: true
  block_push_on_divergence: true
  block_commit_on_stale: true
  block_push_on_stale: true
  block_commit_when_dirty: false
  block_push_when_dirty: false
  scope_violation_action: block
  dependency_config_action: warn
protected_paths:
  - ".github/workflows/*"
  - "deploy/*"
  - "infra/*"
  - "billing/*"
  - "auth/*"
dependency_config_paths:
  - "demo_freelancer_context_switch/ClientB/site_config.json"
  - "demo_freelancer_context_switch/ClientB/**/*.json"
